<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VisionBiomech — Doctor dashboard</title>
<style>
:root{--blue:#3b5bdb;--blue2:#5c7cff;--bg:#eef1f8;--card:#fff;--ink:#151b2e;--mut:#7580a0;--green:#1fbf75;--orange:#f5a524;--hair:#e2e7f2}
*{box-sizing:border-box;margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif}
body{background:var(--bg);color:var(--ink)}
.hidden{display:none!important}
button{cursor:pointer;font:inherit}
.btn{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:11px 16px;font-weight:600}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--hair)}
.btn:active{opacity:.85}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--hair);border-radius:10px;font:inherit;background:#fff}
label{font-size:.78rem;font-weight:600;color:var(--mut);display:block;margin:10px 0 4px}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{background:var(--card);border-radius:20px;padding:30px 26px;width:100%;max-width:360px;box-shadow:0 10px 30px rgba(21,27,46,.1)}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.25rem;margin-bottom:4px}
.logo .dot{width:12px;height:12px;border-radius:50%;background:var(--blue)}
.sub{color:var(--mut);font-size:.85rem;margin-bottom:20px}
.err{color:#e5484d;font-size:.82rem;margin-top:10px;min-height:18px}

/* app */
.top{background:linear-gradient(135deg,#3b5bdb 0%,#2942b8 100%);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;position:sticky;top:0;z-index:5;box-shadow:0 6px 20px rgba(59,91,219,.28)}
.top .logo{color:#fff}
.top .logo .dot{background:#fff}
.top #who{color:rgba(255,255,255,.85)!important}
.top .btn.ghost{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.45)}
.top .btn.ghost:active{background:rgba(255,255,255,.28)}
.wrap{display:grid;grid-template-columns:320px 1fr;gap:18px;max-width:1200px;margin:18px auto;padding:0 18px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 3px 14px rgba(21,27,46,.06)}
.card h3{font-size:.95rem;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:12px;background:#f7f9fd;cursor:pointer;border:2px solid transparent}
.pitem.on{border-color:var(--blue);background:#eef2fe}
.pitem .n{font-weight:600}
.pitem .m{font-size:.74rem;color:var(--mut)}
.badge{background:#eaeefc;color:var(--blue);font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:100px}
.rx{border:1px solid var(--hair);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.rx .t{font-weight:600}
.rx .m{font-size:.76rem;color:var(--mut)}
.sess{border:1px solid var(--hair);border-radius:12px;padding:12px 13px;margin-bottom:9px}
.sess .h{display:flex;justify-content:space-between;font-weight:600}
.stats{display:flex;gap:14px;margin-top:7px;flex-wrap:wrap}
.stat{font-size:.78rem;color:var(--mut)}
.stat b{color:var(--ink);font-size:.95rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.muted{color:var(--mut);font-size:.85rem;padding:14px 2px}
.spark{height:34px;width:100%}
.modal{position:fixed;inset:0;background:rgba(21,27,46,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal .box{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:380px}
.grp-h{font-weight:700;font-size:.8rem;margin:14px 0 4px}
.chart-cell{background:#f7f9fd;border-radius:10px;padding:8px}
.chart-cell h5{font-size:.74rem;font-weight:600;margin-bottom:2px}
.dstat{background:#f7f9fd;border-radius:12px;padding:13px;text-align:center}
.dstat .v{font-size:1.4rem;font-weight:800;color:var(--blue)}
.dstat .l{font-size:.68rem;color:var(--mut);margin-top:3px}
.mini{border:0;cursor:pointer;font:inherit;font-size:.7rem;font-weight:700;
       padding:4px 9px;border-radius:7px;background:#e9edf7;color:#3446c9}
.mini.danger{background:#fdecea;color:#c0392b}
.mini:hover{filter:brightness(.95)}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

<!-- LOGIN -->
<section id="login">
  <div class="box">
    <div class="logo"><span class="dot"></span>VisionBiomech</div>
    <div class="sub">Doctor dashboard — sign in</div>
    <label>Email</label><input id="email" value="doctor@demo.com" autocomplete="username">
    <label>Password</label><input id="password" type="password" value="demo1234" autocomplete="current-password">
    <div class="err" id="lerr"></div>
    <button class="btn" style="width:100%;margin-top:14px" onclick="login()">Sign in</button>
  </div>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <div class="top">
    <div class="logo" style="font-size:1.05rem"><span class="dot"></span>VisionBiomech · Doctor</div>
    <div><span id="who" style="color:var(--mut);font-size:.85rem;margin-right:12px"></span>
      <button class="btn ghost" style="margin-right:8px" onclick="showExercise()">+ Exercise</button>
      <button class="btn ghost" onclick="logout()">Logout</button></div>
  </div>
  <div class="wrap">
    <div class="card">
      <h3>Patients <button class="btn ghost" style="padding:6px 10px;font-size:.8rem" onclick="showAdd()">+ Add</button></h3>
      <div class="plist" id="plist"></div>
      <div style="font-weight:700;font-size:.85rem;color:var(--mut);margin:18px 0 8px">
        EXERCISE CATALOGUE</div>
      <div class="plist" id="exlist"></div>
    </div>
    <div class="card" id="detail"><div class="muted">Select a patient to see their history and assign exercises.</div></div>
  </div>
</div>

<!-- ADD PATIENT MODAL -->
<div class="modal hidden" id="addModal">
  <div class="box">
    <h3 style="margin-bottom:6px">New patient</h3>
    <label>Name</label><input id="a_name">
    <label>Email</label><input id="a_email">
    <label>Password</label><input id="a_pass" value="demo1234">
    <div class="err" id="aerr"></div>
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="btn ghost" style="flex:1" onclick="hideAdd()">Cancel</button>
      <button class="btn" style="flex:1" onclick="addPatient()">Create</button>
    </div>
  </div>
</div>

<!-- NEW EXERCISE MODAL -->
<div class="modal hidden" id="exModal">
  <div class="box">
    <h3 style="margin-bottom:6px">New exercise</h3>
    <label>Name</label><input id="ex_name" placeholder="e.g. Wrist curl">
    <label>Muscles</label><input id="ex_muscles" placeholder="e.g. forearm flexors">
    <div class="err" id="ex_err"></div>
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="btn ghost" style="flex:1" onclick="hideExercise()">Cancel</button>
      <button class="btn" style="flex:1" onclick="addExercise()">Create</button>
    </div>
  </div>
</div>

<!-- SESSION DETAIL MODAL -->
<div class="modal hidden" id="detailModal">
  <div class="box" style="max-width:860px;max-height:92vh;overflow:auto">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div><h3 id="dt_title"></h3><div id="dt_sub" style="color:var(--mut);font-size:.84rem"></div></div>
      <button class="btn ghost" onclick="closeDetail()">Close</button>
    </div>
    <div id="dt_videos" style="display:flex;gap:10px;flex-wrap:wrap;margin:14px 0"></div>
    <div id="dt_stats" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0"></div>
    <div id="dt_charts"></div>
  </div>
</div>

<script>
const API = '';                 // same origin (served by the backend)
let TOKEN = localStorage.getItem('vb_token') || '';
let EX = [], CUR = null;
const $ = id => document.getElementById(id);
async function api(path, opts={}) {
  const r = await fetch(API + path, { ...opts, headers: { 'Content-Type':'application/json', ...(TOKEN?{Authorization:'Bearer '+TOKEN}:{}) , ...(opts.headers||{}) } });
  if (r.status === 401) { logout(); throw new Error('unauthorized'); }
  if (!r.ok) throw new Error((await r.json().catch(()=>({detail:r.status}))).detail);
  return r.json();
}

async function login() {
  $('lerr').textContent = '';
  try {
    const d = await api('/auth/login', { method:'POST', body: JSON.stringify({ email:$('email').value, password:$('password').value }) });
    if (d.user.role !== 'doctor') { $('lerr').textContent = 'This account is not a doctor.'; return; }
    TOKEN = d.token; localStorage.setItem('vb_token', TOKEN); enter(d.user);
  } catch(e){ $('lerr').textContent = 'Wrong email or password.'; }
}
function logout(){ TOKEN=''; localStorage.removeItem('vb_token'); $('app').classList.add('hidden'); $('login').classList.remove('hidden'); }
async function boot(){ if(!TOKEN) return; try{ const me=await api('/me'); if(me.role==='doctor') enter(me); }catch(e){} }

async function enter(user){
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('who').textContent = user.name;
  await reloadExercises();
  loadPatients();
}

async function loadPatients(){
  const pts = await api('/patients');
  $('plist').innerHTML = pts.length ? pts.map(p =>
    `<div class="pitem ${CUR===p.id?'on':''}" onclick="openPatient(${p.id},'${p.name.replace(/'/g,"")}')">
       <div><div class="n">${p.name}</div><div class="m">${p.email}</div></div>
       <div style="display:flex;align-items:center;gap:6px">
         <span class="badge">${p.sessions} sess.</span>
         <button class="mini" onclick="event.stopPropagation();editPatient(${p.id})">Edit</button>
         <button class="mini danger" onclick="event.stopPropagation();delPatient(${p.id},'${p.name.replace(/'/g,"")}',${p.sessions})">Delete</button>
       </div></div>`).join('')
    : '<div class="muted">No patients yet. Click “+ Add”.</div>';
}

async function openPatient(id, name){
  CUR = id; loadPatients();
  const [rx, sessions] = await Promise.all([ api(`/patients/${id}/prescriptions`), api(`/patients/${id}/sessions`) ]);
  const exName = i => (EX.find(e=>e.id===i)||{}).name || ('#'+i);
  const opt = EX.map(e=>`<option value="${e.id}">${e.name}</option>`).join('');
  const rxHtml = rx.length ? rx.map(r=>`<div class="rx"
       style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
       <div><div class="t">${exName(r.exercise_id)}</div>
         <div class="m">${r.reps} reps × ${r.sets} sets · ${r.schedule||'no schedule'} ${r.notes?'· '+r.notes:''}</div></div>
       <div style="display:flex;gap:6px;flex-shrink:0">
         <button class="mini" onclick="editRx(${r.id},${r.reps},${r.sets},'${(r.schedule||'').replace(/'/g,"")}','${(r.notes||'').replace(/'/g,"")}',${id})">Edit</button>
         <button class="mini danger" onclick="delRx(${r.id},'${exName(r.exercise_id).replace(/'/g,"")}',${id})">Delete</button>
       </div></div>`).join('')
    : '<div class="muted">No exercises assigned yet.</div>';
  window._sessions = sessions;
  const sessHtml = sessions.length ? sessions.map((s,i)=>sessionCard(s, exName, i)).join('')
    : '<div class="muted">No sessions recorded yet.</div>';
  $('detail').innerHTML = `
    <h3>${name}</h3>
    <div class="grid2" style="align-items:start">
      <div>
        <div style="font-weight:700;font-size:.85rem;color:var(--mut);margin-bottom:8px">ASSIGNED EXERCISES</div>
        ${rxHtml}
        <div style="font-weight:700;font-size:.85rem;color:var(--mut);margin:16px 0 8px">ASSIGN A NEW EXERCISE</div>
        <select id="rx_ex">${opt}</select>
        <div class="grid2" style="margin-top:8px"><div><label>Reps</label><input id="rx_reps" type="number" value="10"></div>
          <div><label>Sets</label><input id="rx_sets" type="number" value="3"></div></div>
        <label>Schedule</label><input id="rx_sched" placeholder="Mon,Wed,Fri 18:00">
        <label>Notes</label><input id="rx_notes" placeholder="optional">
        <button class="btn" style="width:100%;margin-top:12px" onclick="assign(${id})">Assign</button>
      </div>
      <div>
        <div style="font-weight:700;font-size:.85rem;color:var(--mut);margin-bottom:8px">HISTORY (${sessions.length})</div>
        ${sessHtml}
      </div>
    </div>`;
  requestAnimationFrame(()=>sessions.forEach(s=>drawSpark(s)));
}

function sessionCard(s, exName, idx){
  const V=(s.results||{}).vars||{}; const torque=V.elbow_moment; const fat=V.MF_BIClong;
  const peak=a=>a&&a.pred?Math.max(...a.pred.map(Math.abs)).toFixed(1):'–';
  const end=a=>a&&a.pred?a.pred[a.pred.length-1].toFixed(1):'–';
  const dt=new Date(s.created_at).toLocaleString();
  return `<div class="sess" style="cursor:pointer" onclick="openDetail(${idx})"><div class="h"><span>${exName(s.exercise_id)}</span><span style="color:var(--mut);font-weight:400;font-size:.78rem">${dt}</span></div>
    <div class="stats"><span class="stat"><b>${s.reps_done}</b> reps done</span>
      <span class="stat">peak torque <b>${peak(torque)}</b> N·m</span>
      <span class="stat">end fatigue <b>${end(fat)}</b> %</span>
      ${(s.videos&&s.videos.length)?`<span class="stat" style="color:var(--blue)">▶ ${s.videos.length} video</span>`:''}
      <span class="stat" style="color:var(--blue)">details ›</span></div>
    <canvas class="spark" id="sp${s.id}"></canvas></div>`;
}
function drawSpark(s){
  const c=$('sp'+s.id); if(!c) return; const V=((s.results||{}).vars||{}).elbow_moment; if(!V||!V.pred) return;
  const w=c.width=c.clientWidth, h=c.height=34, p=V.pred, mn=Math.min(...p), mx=Math.max(...p)||1, rng=mx-mn||1;
  const x=i=>i/(p.length-1)*w, y=v=>h-2-((v-mn)/rng)*(h-4);
  const g=c.getContext('2d'); g.strokeStyle='#3b5bdb'; g.lineWidth=1.8; g.beginPath();
  p.forEach((v,i)=>{ i?g.lineTo(x(i),y(v)):g.moveTo(x(i),y(v)); }); g.stroke();
}

async function assign(pid){
  try{
    await api('/prescriptions',{ method:'POST', body: JSON.stringify({
      patient_id:pid, exercise_id:+$('rx_ex').value, reps:+$('rx_reps').value, sets:+$('rx_sets').value,
      schedule:$('rx_sched').value, notes:$('rx_notes').value }) });
    openPatient(pid, $('detail').querySelector('h3').textContent);
  }catch(e){ alert('Error: '+e.message); }
}

function showAdd(){ $('addModal').classList.remove('hidden'); }
function hideAdd(){ $('addModal').classList.add('hidden'); $('aerr').textContent=''; }
async function addPatient(){
  try{
    await api('/patients',{ method:'POST', body: JSON.stringify({ name:$('a_name').value, email:$('a_email').value, password:$('a_pass').value }) });
    hideAdd(); loadPatients();
  }catch(e){ $('aerr').textContent = e.message; }
}
// ---- session detail (full 13 curves + videos) ----
function openDetail(idx){ renderDetail((window._sessions||[])[idx]); }
function closeDetail(){ $('detailModal').classList.add('hidden'); }
function renderDetail(s){
  if(!s) return;
  $('detailModal').classList.remove('hidden');
  const exName = i => (EX.find(e=>e.id===i)||{}).name || 'Exercise';
  $('dt_title').textContent = exName(s.exercise_id);
  $('dt_sub').textContent = new Date(s.created_at).toLocaleString()+' · '+s.reps_done+' reps · '+(s.mode||'single')+' camera';
  $('dt_videos').innerHTML = (s.videos&&s.videos.length)
    ? s.videos.map(u=>`<video src="${API+u}" muted loop autoplay playsinline style="width:170px;height:120px;object-fit:cover;border-radius:10px;background:#000"></video>`).join('')
    : '<span style="color:var(--mut);font-size:.85rem">no video saved</span>';
  const V=(s.results||{}).vars||{}, time=(s.results||{}).time||[], FL=['BIClong','BICshort','BRA','BRD_hand'];
  const peak=t=>V[t]?Math.max(...V[t].pred.map(Math.abs)):0, end=t=>V[t]?V[t].pred[V[t].pred.length-1]:0;
  const mean=t=>V[t]?V[t].pred.reduce((a,b)=>a+b,0)/V[t].pred.length:0;
  const dstat=(v,l)=>`<div class="dstat"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  $('dt_stats').innerHTML = dstat(peak('elbow_moment').toFixed(1),'Peak torque N·m')
    + dstat(Math.round(Math.max(0,...FL.map(m=>peak('frc_'+m)))),'Peak force N')
    + dstat((FL.reduce((a,m)=>a+mean('act_'+m),0)/4).toFixed(2),'Mean activation')
    + dstat((FL.reduce((a,m)=>a+end('MF_'+m),0)/4).toFixed(1),'End fatigue %');
  const GC={torque:'#3b5bdb',activation:'#1fbf75',force:'#8a5cf6',fatigue:'#f5a524'};
  const groups={torque:[],activation:[],force:[],fatigue:[]};
  Object.values(V).forEach(v=>groups[v.group]&&groups[v.group].push(v));
  const box=$('dt_charts'); box.innerHTML='';
  ['torque','activation','force','fatigue'].forEach(g=>{
    if(!groups[g].length) return;
    const h=document.createElement('div'); h.className='grp-h'; h.style.color=GC[g]; h.textContent=g.toUpperCase(); box.appendChild(h);
    const grid=document.createElement('div'); grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:10px'; box.appendChild(grid);
    groups[g].forEach((v,i)=>{ const cid='dtc_'+g+'_'+i;
      const cell=document.createElement('div'); cell.className='chart-cell';
      cell.innerHTML=`<h5>${v.label}</h5><div style="height:120px"><canvas id="${cid}"></canvas></div>`; grid.appendChild(cell);
      requestAnimationFrame(()=>dchart(cid,time,v.pred,GC[g],v.unit)); });
  });
}
function dchart(id,time,vals,color,unit){ const cv=document.getElementById(id); if(!cv||!window.Chart) return;
  const ylab=(unit&&unit.trim())?unit:'value';
  new Chart(cv,{type:'line',data:{labels:time,datasets:[{label:ylab,data:vals,borderColor:color,backgroundColor:color+'22',fill:true,borderWidth:2,tension:.4,pointRadius:0}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{enabled:true,callbacks:{title:it=>'t = '+time[it[0].dataIndex]+' s',label:it=>it.parsed.y.toFixed(2)+' '+(unit||'')}}},
      scales:{
        x:{title:{display:true,text:'time (s)',color:'#8a93ab',font:{size:9}},ticks:{maxTicksLimit:5,callback:v=>time[v]!=null?(+time[v]).toFixed(0):'',font:{size:8},color:'#8a93ab'},grid:{display:false}},
        y:{title:{display:true,text:ylab,color:'#8a93ab',font:{size:9}},ticks:{maxTicksLimit:4,font:{size:8},color:'#8a93ab'},grid:{color:'#eef1f8'}}}}}); }

// ---- new exercise ----
function showExercise(){ $('exModal').classList.remove('hidden'); }
function hideExercise(){ $('exModal').classList.add('hidden'); $('ex_err').textContent=''; }
async function addExercise(){
  try{ await api('/exercises',{method:'POST',body:JSON.stringify({name:$('ex_name').value,muscles:$('ex_muscles').value})});
    await reloadExercises(); hideExercise();
    if(CUR) openPatient(CUR, $('detail').querySelector('h3').textContent);
  }catch(e){ $('ex_err').textContent = e.message; }
}

// ---------------- CRUD: exercises ----------------
async function reloadExercises(){ EX = await api('/exercises'); renderExercises(); }

function renderExercises(){
  const box = $('exlist'); if(!box) return;
  box.innerHTML = EX.length ? EX.map(e=>
    `<div class="pitem">
       <div><div class="n">${e.name}</div><div class="m">${e.muscles||'—'}</div></div>
       <div style="display:flex;gap:6px">
         <button class="mini" onclick="editEx(${e.id},'${e.name.replace(/'/g,"")}','${(e.muscles||'').replace(/'/g,"")}')">Edit</button>
         <button class="mini danger" onclick="delEx(${e.id},'${e.name.replace(/'/g,"")}')">Delete</button>
       </div></div>`).join('')
    : '<div class="muted">No exercises yet. Click “+ Exercise”.</div>';
}

async function editEx(id,name,muscles){
  const n = prompt('Exercise name', name); if(n===null) return;
  const m = prompt('Muscles', muscles); if(m===null) return;
  await api('/exercises/'+id,{method:'PUT',body:JSON.stringify({name:n,muscles:m})});
  await reloadExercises();
  if(CUR) openPatient(CUR, $('detail').querySelector('h3').textContent);
}

async function delEx(id,name){
  if(!confirm('Delete "'+name+'"?\n\nEvery prescription that assigns it will be '
    +'removed too, for all patients. Completed sessions keep their results.')) return;
  const r = await api('/exercises/'+id,{method:'DELETE'});
  await reloadExercises();
  if(r.prescriptions_removed) alert(r.prescriptions_removed+' prescription(s) removed with it.');
  if(CUR) openPatient(CUR, $('detail').querySelector('h3').textContent);
}

// ---------------- CRUD: patients ----------------
async function editPatient(id){
  const cur = (await api('/patients')).find(p=>p.id===id) || {};
  const n = prompt('Patient name', cur.name||''); if(n===null) return;
  const e = prompt('Email', cur.email||''); if(e===null) return;
  const w = prompt('New password (leave empty to keep the current one)', '');
  if(w===null) return;
  const body = {name:n, email:e}; if(w) body.password = w;
  await api('/patients/'+id,{method:'PUT',body:JSON.stringify(body)});
  loadPatients();
  if(CUR===id) openPatient(id, n);
}

async function delPatient(id,name,sessions){
  if(!confirm('Delete patient "'+name+'"?\n\nThis also deletes their '
    +sessions+' session(s), their prescriptions and the stored videos. '
    +'It cannot be undone.')) return;
  const r = await api('/patients/'+id,{method:'DELETE'});
  if(CUR===id){ CUR=null; $('detail').innerHTML='<div class="muted">Select a patient.</div>'; }
  loadPatients();
  alert('Deleted: '+r.prescriptions_removed+' prescription(s), '
        +r.sessions_removed+' session(s), '+r.videos_removed+' video file(s).');
}

// ---------------- CRUD: prescriptions ----------------
async function editRx(id,reps,sets,sched,notes,pid){
  const rp = prompt('Reps', reps); if(rp===null) return;
  const st = prompt('Sets', sets); if(st===null) return;
  const sc = prompt('Schedule', sched); if(sc===null) return;
  const nt = prompt('Notes', notes); if(nt===null) return;
  await api('/prescriptions/'+id,{method:'PUT',
    body:JSON.stringify({reps:+rp, sets:+st, schedule:sc, notes:nt})});
  openPatient(pid, $('detail').querySelector('h3').textContent);
}

async function delRx(id,name,pid){
  if(!confirm('Remove the assignment "'+name+'"?\n\nSessions already completed '
    +'under it keep their results.')) return;
  const r = await api('/prescriptions/'+id,{method:'DELETE'});
  if(r.sessions_detached) alert(r.sessions_detached+' completed session(s) kept, now unlinked.');
  openPatient(pid, $('detail').querySelector('h3').textContent);
}

boot();
</script>
